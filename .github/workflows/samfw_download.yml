name: Download using a Direct Link
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Your Model Number'
        required: true

      samfw_link:
        description: 'Enter the Direct Download Link from Samfw.com:'
        required: true

      upload_to_telegram:
        description: 'Upload to Telegram'
        type: boolean
        required: true
        default: false
        
      cleanup_space_before_run:
        description: 'Cleanup space before run'
        type: boolean
        required: false
        default: false
              
jobs:
  samloader-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Install aria2
        run: sudo apt update && sudo apt install -y aria2

      - name: Start background download
        run: |
          aria2c --max-download-limit=1K "${{ github.event.inputs.samfw_link }}" &
          echo $! > bg_pid.txt

      - name: Free disk space
        if: ${{ github.event.inputs.cleanup_space_before_run == 'true' }}
        run: |
          sudo bash tools/util_free_space.sh

      - name: Stop background download
        run: |
          if [ -f bg_pid.txt ]; then
            kill $(cat bg_pid.txt) || true
            rm bg_pid.txt
          fi

      - name: Set environment variables
        run: |
          echo "MODEL=${{ github.event.inputs.model }}" >> $GITHUB_ENV
          echo "WORKFLOW_MODE=1" >> $GITHUB_ENV
          
      - name: Running samloader-actions
        run: |
          bash sam.sh --url "${{ github.event.inputs.samfw_link }}" --model "${{ github.event.inputs.model }}"  

      - name: Uploading Stock Files
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Stock files - ${{ env.MODEL }}"
          path: Dist/${{ github.event.inputs.model }}*.zip

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Send Telegram Message with Gofile Link
        if: ${{ github.event.inputs.upload_to_telegram == 'true' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            <b>New Dump 📂..!</b>

            <b>Device :</b> ${{ env.MODEL }}
            <b>From Repository:</b> <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a>

            <b>Download Links:</b>
            <a href="${{ env.GOLINK_FULL }}">Full Stock Firmware</a>
            <a href="${{ env.GOLINK_MAGISK }}">Magisk Files</a>

            <b>Powered by:</b> <a href="https://github.com/ravindu644/samloader-actions">samloader-actions</a>

  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: samloader-actions
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
