<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmware Downloads</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.6; padding: 20px; background-color: #f6f8fa; color: #24292e; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #d1d5da; border-radius: 6px; padding: 24px; }
        h1 { border-bottom: 1px solid #e1e4e8; padding-bottom: 0.3em; }
        .firmware-info { margin-top: 20px; }
        .firmware-info p { margin: 5px 0; }
        .firmware-info strong { display: inline-block; width: 100px; }
        .downloads { margin-top: 20px; }
        .downloads a {
            display: inline-block;
            padding: 10px 15px;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }
        .downloads a:hover { background-color: #2c974b; }
        .downloads a.disabled { background-color: #94d3a2; cursor: not-allowed; }
        #loading { text-align: center; font-size: 1.2em; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Latest Firmware</h1>
        <div id="loading">Loading firmware information...</div>
        <div id="content" style="display: none;">
            <div class="firmware-info">
                <p><strong>Model:</strong> <span id="model"></span></p>
                <p><strong>Version:</strong> <span id="version"></span></p>
                <p><strong>CSC:</strong> <span id="csc"></span></p>
                <p><strong>Updated:</strong> <span id="timestamp"></span></p>
            </div>
            <div class="downloads">
                <h3>Downloads</h3>
                <div id="download-links"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('firmware_info.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('model').textContent = data.model;
                    document.getElementById('version').textContent = data.version;
                    document.getElementById('csc').textContent = data.csc;
                    document.getElementById('timestamp').textContent = new Date(data.timestamp).toLocaleString();

                    const linksContainer = document.getElementById('download-links');
                    const downloads = data.downloads;

                    if (downloads.gofile_full && downloads.gofile_full !== 'N/A') {
                        linksContainer.innerHTML += `<a href="${downloads.gofile_full}" target="_blank">Download Full Stock (GoFile)</a>`;
                    }
                    if (downloads.gofile_magisk && downloads.gofile_magisk !== 'N/A') {
                        linksContainer.innerHTML += `<a href="${downloads.gofile_magisk}" target="_blank">Download Magisk Files (GoFile)</a>`;
                    }

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                })
                .catch(error => {
                    document.getElementById('loading').textContent = 'Failed to load firmware information. Please check back later.';
                    console.error('There has been a problem with your fetch operation:', error);
                });
        });
    </script>

</body>
</html>
